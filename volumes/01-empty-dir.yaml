apiVersion: v1
kind: pod
metadata:
  name: test-pod
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-logs
      mountPath: /var/log/nginx
  - name: almalinux
    image: almalinux:9
    volumeMounts:
    - name: almalinux-logs
      mountPath: /mnt/nginx-logs
      readOnly: true
  volumes:
  - name: nginx-logs
    emptyDir: 
      sizeLimit: 500Mi
  - name: almalinux-logs
    emptyDir:
      sizeLimit: 500Mi