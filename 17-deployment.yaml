apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: mongodb
  # there labels are replicaset labels
  labels:
    project: roboshop
    purpose: rs-demo
    tier: db
    component: mongodb
  annotation:
    description: "Moving to 1.29.7"
spec:
    replicas: 4
    selector:
    # using there labels replica set selectts the pod 
      matchLabels:
        project: roboshop
        purpose: rs-demo
        tier: db
        component: mongodb
    # this is pod definition, pod is subset of replica set.
    template:
      metadata:
        labels:
          project: roboshop
          purpose: rs-demo
          tier: db
          component: mongodb
      spec:
        containers:
        - name: mongodb
          image: gopalk1/mongodb:1.0.0
---
apiVersion: v1
kind: service
metadata:
  name: nginx
spec:
  selector:
  # labels are used as selectors 
    project: roboshop
    component: frontend
  ports:
  - protocol: TCP
    port: 80 # service port
    targetPort: 80 # container port
---
apiVersion: v1
kind: service
metadata:
  name: nginx-headless
spec:
  clusterIP: None
  selector:
  # labels are used as selectors 
    project: roboshop
    component: frontend
  ports:
  - protocol: TCP
    port: 80 # service port
    targetPort: 80 # container port