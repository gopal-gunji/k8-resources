
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: mongodb
  labels:
    project: roboshop
    purpose: rs-demo
    tier: db
    component: mongodb
  annotations:
    description: "Moving to 1.29.7"
spec:
  replicas: 4
  selector:
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: db
      component: mongodb
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: db
        component: mongodb
    spec:
      containers:
      - name: mongodb
        image: gopalk1/mongodb:1.0.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    project: roboshop
    component: mongodb
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: mongodb
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
